---
- name: Verify deployment of users, authorized_keys, groups, and sudo config
  hosts: all
  gather_facts: false
  tasks:
  - name: Verify wanted users are present
    check_mode: true
    ansible.builtin.user:
      name: "{{ item }}"
      state: present
    register: ret
    failed_when: ret.changed
    loop: "{{ ['eo', 'nigel', 'tom'] }}"

  - name: Verify authorized_keys are present for all users
    check_mode: true
    ansible.builtin.file:
      name: "{{ '/home/' + item + '/.ssh/authorized_keys' }}"
      state: present
    register: ret
    failed_when: ret.changed
    loop: "{{ ['eo', 'nigel', 'tom'] }}"

  - name: Verify unwanted users are not present
    check_mode: true
    ansible.builtin.user:
      name: "{{ item }}"
      state: absent
    register: ret
    failed_when: ret.changed
    loop: "{{ ['haxxxor', 'soyboy'] }}"

  - name: Verify wanted groups are present
    check_mode: true
    ansible.builtin.group:
      name: "{{ item }}"
      state: present
    register: ret
    failed_when: ret.changed
    loop: "{{ ['hamadmin', 'ham'] }}"

  - name: Verify hamadmin group can sudo
    check_mode: true
    ansible.builtin.lineinfile:
      path: /etc/sudoers.d/hamadmin
      line: "%hamadmin ALL=(ALL) NOPASSWD:ALL"
      state: present
    register: ret
    failed_when: ret.changed

  - name: Verify unwanted groups are absent
    check_mode: true
    ansible.builtin.group:
      name: "{{ item }}"
      state: absent
    register: ret
    failed_when: ret.changed
    loop:
      - hamwan
    when: inventory_hostname == 'test.group.change'

  - name: Verify unwanted sudoers configs are absent
    check_mode: true
    ansible.builtin.file:
      name: "{{ item }}"
      state: absent
    register: ret
    failed_when: ret.changed
    loop:
      - /etc/sudoers.d/hamwan
    when: inventory_hostname == 'test.group.change'

  - name: Verify group management scope contains only wanted groups
    check_mode: true
    ansible.builtin.copy:
      dest: /etc/group_managed_scope
      content: "hamadmin\nham\n"
    register: ret
    failed_when: ret.changed

  - name: Read authorized_keys of tom and eo
    become: true
    ansible.builtin.slurp:
      src: "/home/{{ item }}/.ssh/authorized_keys"
    register: ak
    loop: [tom, eo]

  - name: Verify tom has exactly the keys in test_keys/tom.key (multi-key file, stray key removed)
    ansible.builtin.assert:
      that:
        - (ak.results[0].content | b64decode).splitlines() | select | sort
          == lookup('ansible.builtin.file', 'test_keys/tom.key').splitlines() | select | sort
      fail_msg: "tom authorized_keys: {{ (ak.results[0].content | b64decode).splitlines() }}"

  - name: Verify the connecting account (eo) kept its extra key
    ansible.builtin.assert:
      that:
        - "'eo-extra@molecule-test' in (ak.results[1].content | b64decode)"
    when: inventory_hostname == 'test.extra.users'

- name: Verify protections (these run the role again with altered user lists)
  ansible.builtin.import_playbook: verify_protection.yml
