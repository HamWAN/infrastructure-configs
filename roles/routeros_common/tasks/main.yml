---
# tasks for common settings

- name: Look for the device at its management name (routeros_mgmt_name_try)
  ansible.builtin.include_tasks:
    file: use_mgmt_name.yml
  when:
    - routeros_mgmt_name_try | bool
    - routeros_mgmt_name_checked is not defined

- name: Check the RouterOS session is usable (login options / wide terminal)
  ansible.builtin.include_tasks:
    file: check_terminal.yml

- name: call common task template
  block:
    - name: collect facts
      ansible.builtin.include_tasks:
        file: get_facts.yml
      loop: "{{ routeros_facts }}"

    - name: common settings
      ansible.builtin.include_tasks:
        file: check_and_set_value.yml
      loop: "{{ settings.simple_settings }}"

    - name: v6 common settings
      ansible.builtin.include_tasks:
        file: check_and_set_value.yml
      loop: "{{ settings.v6_simple_settings }}"
      when: routeros_version is match("^6.")

    - name: v7 common settings
      ansible.builtin.include_tasks:
        file: check_and_set_value.yml
      loop: "{{ settings.v7_simple_settings }}"
      when: routeros_version is match("^7.")

- name: setup users
  block:
    - name: Manage Mikrotik users
      ansible.builtin.include_tasks:
        file: manage_users.yml
