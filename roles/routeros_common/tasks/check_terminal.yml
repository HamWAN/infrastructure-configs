---
# Make sure the RouterOS session is in "wide" mode before any other command is sent.
# First, add the login options to the user name if they are missing (routeros_login_options).
#
# The login options after '+' in the user name (e.g. 'myname+cet512w') set the terminal width.
# Without them RouterOS wraps any input line longer than ~80 characters (prompt included) and
# echoes it back in fragments ('<ent set servers=...').  The fragments are not stripped from the
# output, so set commands look as if they failed and settings never compare as correct.
#
# The usual cause is libssh (ansible_network_cli_ssh_type: libssh) taking the user name from a
# 'User' line in ~/.ssh/config instead of -u / ansible_user, silently dropping '+cet512w'.
# See the README ("Logging in: the +cet512w suffix").
#
# The probe is a command that does nothing and prints nothing (':local' only sets a variable for
# this one command).  It is 85 characters: longer than RouterOS's default 80-column line, so it
# wraps whenever the login options are missing, but short enough to fit the 132 columns of
# '+ct132w' (used by the molecule tests) as well as '+cet512w'.  In wide mode its output is empty.
# Only the probe's own echo counts as wrapping; other output is reported and ignored.

# Add the login options to the user name if the user did not.  The name Ansible will use is
# read on the controller (nothing is sent to the router), and if it has no '+' part,
# '+{{ routeros_login_options }}' is appended and set as ansible_user for this host.  set_fact
# outranks -u, inventory and ansible.cfg (it is built from whichever of those applied), but not
# -e ansible_user=... or a 'User' line in ~/.ssh/config; the wide-mode check below catches those.
# network_cli keys its persistent connection on the user name, so the next command logs in
# afresh with the new name.
- name: Find the login name Ansible will use
  hamwan_connection_user:
  register: routeros_login_initial
  check_mode: false
  when: routeros_login_options | default('', true) | length > 0

- name: Add the RouterOS login options to the user name
  ansible.builtin.set_fact:
    ansible_user: "{{ routeros_login_initial.user }}+{{ routeros_login_options }}"
  when:
    - routeros_login_options | default('', true) | length > 0
    - routeros_login_initial.user | default('') | length > 0
    - "'+' not in routeros_login_initial.user"

- name: Check that the RouterOS terminal is in wide mode
  community.routeros.command:
    commands:
      - ':local routerosCommonWideModeCheck "{{ ("0123456789" * 5)[:41] }}WrapEnd"'
  register: routeros_wide_probe
  changed_when: false
  check_mode: false

# Wrapped means the probe's own text came back.  The probe ends with the marker 'WrapEnd': a
# wrapped echo always shows the end of the line, so the marker is there however short the prompt
# is (the probe's name and digits are also looked for).
# Anything else the router prints here - a warning or notice - is not wrapping: it is shown, and
# the role carries on.
- name: Work out whether the probe was echoed back wrapped
  ansible.builtin.set_fact:
    routeros_probe_output: "{{ routeros_wide_probe.stdout[0] | default('') | trim }}"
    routeros_probe_wrapped: >-
      {{ (routeros_wide_probe.stdout[0] | default('')) is search('WrapEnd|WideModeCheck|0123456789') }}

- name: Show unexpected output from the terminal check
  ansible.builtin.debug:
    msg: >-
      NOTE: the router printed something in reply to the terminal check that is not a wrapped
      echo, so the session is taken to be in wide mode: {{ routeros_probe_output }}
  when:
    - routeros_probe_output | length > 0
    - not routeros_probe_wrapped | bool

- name: Find the login name Ansible asked for
  hamwan_connection_user:
  register: routeros_login_for_probe
  check_mode: false
  when: routeros_probe_wrapped | bool

# RouterOS 7.25 (including its betas and release candidates) ignores the login options: its
# 7.25.1 changelog says "console - fix custom SSH client login parameters being ignored
# (introduced in v7.25)".  This is a short command, so the wrapping does not matter.
- name: Read the RouterOS version (the terminal is not in wide mode)
  community.routeros.command:
    commands: ":put [/system resource get version]"
  register: routeros_version_for_probe
  changed_when: false
  check_mode: false
  when: routeros_probe_wrapped | bool

- name: Explain a RouterOS 7.25 login-options failure
  ansible.builtin.set_fact:
    routeros_wide_mode_hint: >-
      {{ 'This router runs RouterOS ' ~ (routeros_version_for_probe.stdout[0] | trim) ~ ', which
      ignores the login options (a RouterOS bug, fixed in 7.25.1): upgrade it to 7.25.1 or later.  '
      if (routeros_version_for_probe.stdout[0] | default('') | trim)
         is match('7\.25((beta|rc)\d+)?(\s|$)') else '' }}
  when: routeros_probe_wrapped | bool

- name: Warn that the terminal check is off and the terminal is not in wide mode
  ansible.builtin.debug:
    msg: >-
      WARNING: the RouterOS session is not in wide mode and routeros_require_wide_terminal is
      false, so carrying on.  Long set commands may be misread and re-applied on every run.
      {{ routeros_wide_mode_hint | default('') }}
  when:
    - routeros_probe_wrapped | bool
    - not routeros_require_wide_terminal | bool

- name: Stop if the terminal is not in wide mode
  ansible.builtin.assert:
    that:
      - not routeros_probe_wrapped | bool
    fail_msg: >-
      {{ routeros_wide_mode_hint | default('') }}The RouterOS session is not in wide mode: a long command was echoed back wrapped, so this
      role would misread the output.  Ansible asked to log in as
      '{{ routeros_login_for_probe.user | default('?') }}'.  Check the router log
      (/log print where message~"publickey accepted") for the name it actually received.  It
      must include the '+cet512w' options.  If it does not, a 'User' line in ~/.ssh/config is
      probably overriding -u / ansible_user (libssh gives it priority): remove it for the
      routers, or set it to 'User yourname+cet512w'.  If the name is right and this still fails,
      the RouterOS version may ignore the width option (7.25 does); set
      routeros_require_wide_terminal=false to skip this check at your own risk.
    quiet: true
  when: routeros_require_wide_terminal | bool

- name: Note that the terminal check has run for this host
  ansible.builtin.set_fact:
    routeros_terminal_checked: true
