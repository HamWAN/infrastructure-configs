---
# Install (or replace) the SSH public key for one RouterOS user.  Included in a loop with
# loop_var 'key_user'.  Never called in check mode.
#
# Ordering is chosen so a failure never leaves the user without a key:
#   1. remember the ids of the keys the user has now
#   2. fetch the master key (a failed download is reported, and nothing else is done), then
#      import it (the user now has old + new)
#   3. confirm the key count went up and, where the device shows fingerprints, that the
#      master key's fingerprint is present
#   4. only then remove the old keys, by id
# The key file RouterOS downloads is removed afterwards.

- name: "Note ids of existing SSH keys - {{ key_user }}"
  community.routeros.command:
    commands: ':put [/user ssh-keys find user="{{ key_user }}"]'
  register: ssh_old_keys
  changed_when: false

- name: "Remember old key ids - {{ key_user }}"
  ansible.builtin.set_fact:
    old_key_ids: "{{ ssh_old_keys.stdout[0] | regex_findall('[*][0-9A-Fa-f]+') }}"

- name: "Remove any leftover key file - {{ key_user }}"
  community.routeros.command:
    commands: '/file remove [find name="{{ key_user }}.key"]'
  changed_when: false  # temporary file only

- name: "Fetch master public key - {{ key_user }}"
  community.routeros.command:
    commands: '/tool fetch url="{{ routeros_ssh_key_fetch_base_url }}{{ key_user }}.key"'
  changed_when: false  # downloads a temporary file, removed below
  register: ssh_fetch

# A failed download is reported as text ('status: failed' ... 'failure: timeout connecting' or
# 'failure: Status 404, Not Found'), not as an error.  Without this check the import that follows
# would fail too and be mistaken for RouterOS refusing the key.  Like a refused key, it does not
# stop the run: the account is left as it is and reported at the end of manage_users.yml.
- name: "Check the download worked - {{ key_user }}"
  ansible.builtin.set_fact:
    ssh_fetch_ok: "{{ 'status: finished' in (ssh_fetch.stdout[0] | default('')) }}"

- name: "Record the failed download - {{ key_user }}"
  ansible.builtin.set_fact:
    routeros_key_download_failed: >-
      {{ routeros_key_download_failed | default([]) + [{'user': key_user,
         'reason': (ssh_fetch.stdout[0] | default('') | regex_findall('failure: .*') | last
                    | default('no "status: finished" from /tool fetch')) | trim}] }}
  when: not ssh_fetch_ok | bool

- name: "Import and verify the master key - {{ key_user }}"
  when: ssh_fetch_ok | bool
  block:
    - name: "Import public key - {{ key_user }}"
      community.routeros.command:
        commands: '/user ssh-keys import public-key-file={{ key_user }}.key user={{ key_user }}'
      # RouterOS reports a refused key as text ('failure: ...'), not as an error, so keep it for
      # the check below.  RouterOS 7.25+ refuses RSA keys with a small public exponent (e.g. 35 or
      # 37, made by old PuTTY versions): 'failure: key uses insecure RSA public exponent!'.
      register: ssh_import
      changed_when: "'failure:' not in (ssh_import.stdout[0] | default(''))"

    - name: "Count SSH keys after import - {{ key_user }}"
      community.routeros.command:
        commands: ':put [:len [/user ssh-keys find user="{{ key_user }}"]]'
      register: ssh_new_count
      changed_when: false

    # A key RouterOS refuses ('failure: ...' and no new key) does not stop the run: the account is
    # left as it is (old keys kept), the user is recorded in routeros_refused_keys and reported at
    # the end of manage_users.yml, and the remaining users carry on.
    - name: "Note whether RouterOS refused the key - {{ key_user }}"
      ansible.builtin.set_fact:
        ssh_import_refused: >-
          {{ (ssh_new_count.stdout[0] | trim | int <= old_key_ids | length)
             and ('failure:' in (ssh_import.stdout[0] | default(''))) }}

    - name: "Record the refused key - {{ key_user }}"
      ansible.builtin.set_fact:
        routeros_refused_keys: >-
          {{ routeros_refused_keys | default([]) + [{'user': key_user,
             'reason': ssh_import.stdout[0] | default('') | trim}] }}
      when: ssh_import_refused | bool

    # Any other import that adds no key is unexplained, so it still stops the run for this host.
    - name: "Confirm a key was added - {{ key_user }}"
      ansible.builtin.assert:
        that:
          - ssh_new_count.stdout[0] | trim | int > old_key_ids | length
        fail_msg: >-
          Import for {{ key_user }} did not add a key (had {{ old_key_ids | length }},
          now {{ ssh_new_count.stdout[0] | trim }}).  The old key(s) were left in place.
          RouterOS said: '{{ ssh_import.stdout[0] | default('') | trim }}'.
      when: not ssh_import_refused | bool

    - name: "Verify the new key and remove the old ones - {{ key_user }}"
      when: not ssh_import_refused | bool
      block:
        - name: "Read back SSH keys - {{ key_user }}"
          community.routeros.command:
            commands: '/user ssh-keys print detail without-paging where user="{{ key_user }}"'
          register: ssh_after
          changed_when: false

        - name: "Compare fingerprints with the master key - {{ key_user }}"
          ansible.builtin.set_fact:
            ssh_after_fps: >-
              {{ (ssh_after.stdout[0] | routeros_ssh_keys_parse).get(key_user, [])
                 | map(attribute='fingerprints') | flatten | list }}
            ssh_expected_fps: >-
              {{ [master_keys[key_user].sha256, master_keys[key_user].md5]
                 if (master_keys[key_user] | default({})).valid | default(false) else [] }}

        - name: "Confirm the imported key is the master key - {{ key_user }}"
          ansible.builtin.assert:
            that:
              - ssh_after_fps | length == 0 or ssh_expected_fps | length == 0 or (ssh_after_fps | intersect(ssh_expected_fps) | length > 0)
            fail_msg: >-
              After import, {{ key_user }}'s keys on the device ({{ ssh_after_fps }}) do not include the
              master key ({{ ssh_expected_fps }}).  The old key(s) were left in place.

        - name: "Remove old SSH keys - {{ key_user }}"
          community.routeros.command:
            commands: '/user ssh-keys remove {{ item }}'
          loop: "{{ old_key_ids }}"

- name: "Remove downloaded key file - {{ key_user }}"
  community.routeros.command:
    commands: '/file remove [find name="{{ key_user }}.key"]'
  changed_when: false  # temporary file only
