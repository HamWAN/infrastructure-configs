---
# Install (or replace) the SSH public key for one RouterOS user.  Included in a loop with
# loop_var 'key_user'.  Never called in check mode.
#
# Ordering is chosen so a failure never leaves the user without a key:
#   1. remember the ids of the keys the user has now
#   2. fetch + import the master key (the user now has old + new)
#   3. confirm the key count went up and, where the device shows fingerprints, that the
#      master key's fingerprint is present
#   4. only then remove the old keys, by id
# The key file RouterOS downloads is removed afterwards.

- name: "Note ids of existing SSH keys - {{ key_user }}"
  community.routeros.command:
    commands: ':put [/user ssh-keys find user="{{ key_user }}"]'
  register: ssh_old_keys
  changed_when: false

- name: "Remember old key ids - {{ key_user }}"
  ansible.builtin.set_fact:
    old_key_ids: "{{ ssh_old_keys.stdout[0] | regex_findall('[*][0-9A-Fa-f]+') }}"

- name: "Remove any leftover key file - {{ key_user }}"
  community.routeros.command:
    commands: '/file remove [find name="{{ key_user }}.key"]'

- name: "Fetch master public key - {{ key_user }}"
  community.routeros.command:
    commands: '/tool fetch url="{{ routeros_ssh_key_base_url }}{{ key_user }}.key"'

- name: "Import public key - {{ key_user }}"
  community.routeros.command:
    commands: '/user ssh-keys import public-key-file={{ key_user }}.key user={{ key_user }}'

- name: "Count SSH keys after import - {{ key_user }}"
  community.routeros.command:
    commands: ':put [:len [/user ssh-keys find user="{{ key_user }}"]]'
  register: ssh_new_count
  changed_when: false

- name: "Confirm a key was added - {{ key_user }}"
  ansible.builtin.assert:
    that:
      - ssh_new_count.stdout[0] | trim | int > old_key_ids | length
    fail_msg: >-
      Import for {{ key_user }} did not add a key (had {{ old_key_ids | length }},
      now {{ ssh_new_count.stdout[0] | trim }}).  The old key(s) were left in place.

- name: "Read back SSH keys - {{ key_user }}"
  community.routeros.command:
    commands: '/user ssh-keys print detail where user="{{ key_user }}"'
  register: ssh_after
  changed_when: false

- name: "Compare fingerprints with the master key - {{ key_user }}"
  ansible.builtin.set_fact:
    ssh_after_fps: >-
      {{ (ssh_after.stdout[0] | routeros_ssh_keys_parse).get(key_user, [])
         | map(attribute='fingerprints') | flatten | list }}
    ssh_expected_fps: >-
      {{ [master_keys[key_user].sha256, master_keys[key_user].md5]
         if (master_keys[key_user] | default({})).valid | default(false) else [] }}

- name: "Confirm the imported key is the master key - {{ key_user }}"
  ansible.builtin.assert:
    that:
      - ssh_after_fps | length == 0 or ssh_expected_fps | length == 0 or (ssh_after_fps | intersect(ssh_expected_fps) | length > 0)
    fail_msg: >-
      After import, {{ key_user }}'s keys on the device ({{ ssh_after_fps }}) do not include the
      master key ({{ ssh_expected_fps }}).  The old key(s) were left in place.

- name: "Remove old SSH keys - {{ key_user }}"
  community.routeros.command:
    commands: '/user ssh-keys remove {{ item }}'
  loop: "{{ old_key_ids }}"

- name: "Remove downloaded key file - {{ key_user }}"
  community.routeros.command:
    commands: '/file remove [find name="{{ key_user }}.key"]'
