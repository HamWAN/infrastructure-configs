---
# Install (or replace) the SSH public key for one RouterOS user.  Included in a loop with
# loop_var 'key_user'.  Never called in check mode.
#
# Ordering is chosen so a failure never leaves the user without a key:
#   1. remember the ids of the keys the user has now
#   2. the router fetches the master key (a failed download is reported, nothing else is done)
#   3. read the downloaded file back and check it is exactly the master key Ansible validated;
#      if not, nothing is imported
#   4. import it (the user now has old + new) and confirm an entry was added
#   5. where the device shows fingerprints, check the new entry is the master key; if it is
#      not, remove it again and stop
#   6. only then remove the old keys, by id
# The key file RouterOS downloads is removed afterwards.

- name: "Note ids of existing SSH keys - {{ key_user }}"
  community.routeros.command:
    commands: ':put [/user ssh-keys find user="{{ key_user }}"]'
  register: ssh_old_keys
  changed_when: false

- name: "Remember old key ids - {{ key_user }}"
  ansible.builtin.set_fact:
    old_key_ids: "{{ ssh_old_keys.stdout[0] | regex_findall('[*][0-9A-Fa-f]+') }}"

- name: "Remove any leftover key file - {{ key_user }}"
  community.routeros.command:
    commands: '/file remove [find name="{{ key_user }}.key"]'
  changed_when: false  # temporary file only

- name: "Fetch master public key - {{ key_user }}"
  community.routeros.command:
    commands: '/tool fetch url="{{ routeros_ssh_key_fetch_base_url }}{{ key_user }}.key"'
  changed_when: false  # downloads a temporary file, removed below
  register: ssh_fetch

# A failed download is reported as text ('status: failed' ... 'failure: timeout connecting' or
# 'failure: Status 404, Not Found'), not as an error.  Without this check the import that follows
# would fail too and be mistaken for RouterOS refusing the key.  Like a refused key, it does not
# stop the run: the account is left as it is and reported at the end of manage_users.yml.
- name: "Check the download worked - {{ key_user }}"
  ansible.builtin.set_fact:
    ssh_fetch_ok: "{{ 'status: finished' in (ssh_fetch.stdout[0] | default('')) }}"

- name: "Record the failed download - {{ key_user }}"
  ansible.builtin.set_fact:
    routeros_key_download_failed: >-
      {{ routeros_key_download_failed | default([]) + [{'user': key_user,
         'reason': (ssh_fetch.stdout[0] | default('') | regex_findall('failure: .*') | last
                    | default('no "status: finished" from /tool fetch')) | trim}] }}
  when: not ssh_fetch_ok | bool

# The router downloads the key itself, separately from the copy Ansible fetched and checked, and
# /tool fetch does not verify the key server's certificate.  So before importing anything, read
# the downloaded file back and compare it with the master key Ansible checked.  This works on
# every RouterOS version, including those that show no fingerprints after an import.  A file that
# cannot be read back, or holds anything other than exactly that key, is not imported: the
# account is left as it is and the user is reported with the failed downloads.
- name: "Read back the downloaded key file - {{ key_user }}"
  community.routeros.command:
    commands: ':put [/file get [find name="{{ key_user }}.key"] contents]'
  register: ssh_downloaded
  changed_when: false
  when: ssh_fetch_ok | bool

- name: "Compare the downloaded key with the master key - {{ key_user }}"
  ansible.builtin.set_fact:
    ssh_download_verified: >-
      {{ ssh_fetch_ok | bool
         and (master_keys[key_user] | default({})).valid | default(false)
         and (ssh_downloaded.stdout[0] | default('') | ssh_key_ids) == (master_keys[key_user].line | ssh_key_ids) }}

- name: "Record the download that does not match - {{ key_user }}"
  ansible.builtin.set_fact:
    routeros_key_download_failed: >-
      {{ routeros_key_download_failed | default([]) + [{'user': key_user,
         'reason': 'the file the router downloaded is not the master key Ansible checked (not imported)'}] }}
  when:
    - ssh_fetch_ok | bool
    - not ssh_download_verified | bool

- name: "Import and verify the master key - {{ key_user }}"
  when: ssh_download_verified | bool
  block:
    - name: "Import public key - {{ key_user }}"
      community.routeros.command:
        commands: '/user ssh-keys import public-key-file={{ key_user }}.key user={{ key_user }}'
      # RouterOS reports a refused key as text ('failure: ...'), not as an error, so keep it for
      # the check below.  RouterOS 7.25+ refuses RSA keys with a small public exponent (e.g. 35 or
      # 37, made by old PuTTY versions): 'failure: key uses insecure RSA public exponent!'.
      register: ssh_import
      changed_when: "'failure:' not in (ssh_import.stdout[0] | default(''))"

    - name: "List SSH keys after import - {{ key_user }}"
      community.routeros.command:
        commands: ':put [/user ssh-keys find user="{{ key_user }}"]'
      register: ssh_keys_after_import
      changed_when: false

    # new_key_ids: the entries this import added (normally one).
    # A key RouterOS refuses ('failure: ...' and no new key) does not stop the run: the account is
    # left as it is (old keys kept), the user is recorded in routeros_refused_keys and reported at
    # the end of manage_users.yml, and the remaining users carry on.
    - name: "Note what the import added - {{ key_user }}"
      ansible.builtin.set_fact:
        new_key_ids: "{{ ssh_keys_after_import.stdout[0] | regex_findall('[*][0-9A-Fa-f]+') | difference(old_key_ids) }}"

    - name: "Note whether RouterOS refused the key - {{ key_user }}"
      ansible.builtin.set_fact:
        ssh_import_refused: >-
          {{ (new_key_ids | length == 0) and ('failure:' in (ssh_import.stdout[0] | default(''))) }}

    - name: "Record the refused key - {{ key_user }}"
      ansible.builtin.set_fact:
        routeros_refused_keys: >-
          {{ routeros_refused_keys | default([]) + [{'user': key_user,
             'reason': ssh_import.stdout[0] | default('') | trim}] }}
      when: ssh_import_refused | bool

    # Any other import that adds no key is unexplained, so it still stops the run for this host.
    - name: "Confirm a key was added - {{ key_user }}"
      ansible.builtin.assert:
        that:
          - new_key_ids | length > 0
        fail_msg: >-
          Import for {{ key_user }} did not add a key (the user still has
          {{ old_key_ids | length }}).  The old key(s) were left in place.
          RouterOS said: '{{ ssh_import.stdout[0] | default('') | trim }}'.
      when: not ssh_import_refused | bool

    - name: "Verify the new key and remove the old ones - {{ key_user }}"
      when: not ssh_import_refused | bool
      block:
        # Only the entries this import added are read back, so an old key that happens to match
        # cannot stand in for the new one.
        - name: "Read back the imported key - {{ key_user }}"
          community.routeros.command:
            commands: ':foreach i in={{ new_key_ids | join(",") }} do={/user ssh-keys print detail without-paging from=$i}'
          register: ssh_after
          changed_when: false

        - name: "Compare fingerprints with the master key - {{ key_user }}"
          ansible.builtin.set_fact:
            ssh_after_fps: >-
              {{ (ssh_after.stdout[0] | routeros_ssh_keys_parse).get(key_user, [])
                 | map(attribute='fingerprints') | flatten | list }}
            ssh_expected_fps: "{{ [master_keys[key_user].sha256, master_keys[key_user].md5] }}"

        # Where the device shows fingerprints (RouterOS 7), the imported key must be the master
        # key.  Where it shows none (RouterOS 6) the comparison of the downloaded file above is
        # the check.
        - name: "Decide whether the imported key is the master key - {{ key_user }}"
          ansible.builtin.set_fact:
            ssh_import_is_master: >-
              {{ ssh_after_fps | length == 0 or (ssh_after_fps | intersect(ssh_expected_fps) | length > 0) }}

        # Roll back before failing: a key that is not the master key must not stay on the account.
        - name: "Remove the imported key, it is not the master key - {{ key_user }}"
          community.routeros.command:
            commands: '/user ssh-keys remove {{ item }}'
          loop: "{{ new_key_ids }}"
          when: not ssh_import_is_master | bool

        - name: "Confirm the imported key is the master key - {{ key_user }}"
          ansible.builtin.assert:
            that:
              - ssh_import_is_master | bool
            fail_msg: >-
              The key imported for {{ key_user }} ({{ ssh_after_fps }}) is not the master key
              ({{ ssh_expected_fps }}).  It has been removed again; the old key(s) were left in place.

        - name: "Remove old SSH keys - {{ key_user }}"
          community.routeros.command:
            commands: '/user ssh-keys remove {{ item }}'
          loop: "{{ old_key_ids }}"

- name: "Remove downloaded key file - {{ key_user }}"
  community.routeros.command:
    commands: '/file remove [find name="{{ key_user }}.key"]'
  changed_when: false  # temporary file only
