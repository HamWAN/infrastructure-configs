---
dependency:
  name: galaxy
  options:
    # roles/requirements.yml, found relative to this scenario (roles/<role>/molecule/<scenario>)
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/../../../requirements.yml
    role-file: ${MOLECULE_SCENARIO_DIRECTORY}/../../../requirements.yml
driver:
  name: default
platforms:
  - name: ros6.correct
  - name: ros6.incorrect
  - name: ros6.missing
  - name: ros7.correct
  - name: ros7.incorrect
  - name: ros7.missing
provisioner:
  name: ansible
  log: True
verifier:
  name: ansible
