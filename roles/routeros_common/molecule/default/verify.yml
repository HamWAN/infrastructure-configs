---
- name: Verify installation or correction of settings
  hosts: all
  gather_facts: false

  tasks:
    - name: "Include molecule organization vars (users)"
      ansible.builtin.include_vars: molecule_vars.yml

    - name: "Include group vars for os_routeros"
      ansible.builtin.include_vars: ../../../../group_vars/os_routeros.yml

    - name: "Include default settings"
      ansible.builtin.include_vars: ../../vars/main.yml

    # vars/main.yml selects libssh, which cannot talk to RouterOS 6 (hmac-sha1 only).  Use
    # paramiko for the v6 test routers, as converge.yml does.  set_fact outranks include_vars.
    - name: "Use paramiko for RouterOS 6"
      ansible.builtin.set_fact:
        ansible_network_cli_ssh_type: paramiko
        ansible_paramiko_use_rsa_sha2_algorithms: false
      when: inventory_hostname is match('ros6')

    - name: collect facts
      ansible.builtin.include_tasks:
        file: ../../tasks/get_facts.yml
      loop: "{{ routeros_facts }}"

    - name: common settings
      ansible.builtin.include_tasks:
        file: check_value.yml
      loop: "{{ settings.simple_settings }}"

    - name: v6 common settings
      ansible.builtin.include_tasks:
        file: check_value.yml
      loop: "{{ settings.v6_simple_settings }}"
      when: routeros_version is match("^6.")

    - name: v7 common settings
      ansible.builtin.include_tasks:
        file: check_value.yml
      loop: "{{ settings.v7_simple_settings }}"
      when: routeros_version is match("^7.")

    - name: verify users
      ansible.builtin.include_tasks:
        file: verify_users.yml
