; You can copy this file to your ~ directory to avoid specifying inventory.
[defaults]
inventory=~/infrastructure-configs/inventories/psdr/hosts.sh
forks=30
nocows=True
gathering=explicit

[ssh_connection]
pipelining=True

; RouterOS hosts are reached with libssh (roles/routeros_common/vars/main.yml).  libssh checks
; ~/.ssh/known_hosts and ignores ansible_ssh_args, so without this every new router fails with
; "The authenticity of host ... can't be established".  This accepts and records a router's host
; key without asking - and also a key that has CHANGED (tested: without this setting libssh
; refuses with "Host key for server has changed"), so it gives no protection against a swapped
; key.  See roles/routeros_common/README.md, "Host keys", for the alternatives (an inventory can
; also turn host key checking off for its routers, as inventories/psdr currently does).
; It cannot be set as an inventory/host variable - only here or ANSIBLE_LIBSSH_HOST_KEY_AUTO_ADD.
[libssh_connection]
host_key_auto_add = True
